name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the app imports cleanly
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./ci_check.db"
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

      - name: Run tests
        working-directory: backend
        run: pytest -v
