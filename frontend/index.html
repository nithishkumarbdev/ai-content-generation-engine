<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlitrAI Mini Content Engine</title>
<style>
  :root {
    --bg: #fafafa;
    --panel: #ffffff;
    --border: #e2e2e2;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f6f4f;
    --pending: #9a8b2f;
    --processing: #2f6f9a;
    --completed: #2f9a4f;
    --failed: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 20px 8px;
    max-width: 880px;
    margin: 0 auto;
  }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr;
    grid-template-areas: "form" "jobs" "detail";
  }
  @media (min-width: 720px) {
    main {
      grid-template-columns: 380px 1fr;
      grid-template-areas:
        "form jobs"
        "form detail";
      align-items: start;
    }
  }
  #form-panel { grid-area: form; }
  #jobs-panel { grid-area: jobs; }
  #detail-panel { grid-area: detail; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 14px; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 4px; color: var(--muted); }
  input[type=text], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
  }
  textarea { resize: vertical; min-height: 70px; }
  input[type=file] { margin-top: 4px; font-size: 0.85rem; }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { background: #b9c9be; cursor: not-allowed; }
  #form-error { color: var(--failed); font-size: 0.85rem; margin-top: 8px; min-height: 1em; }

  .job-list { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
  .job-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .job-card:hover { border-color: var(--accent); }
  .job-card.selected { border-color: var(--accent); background: #f3f8f5; }
  .job-name { font-size: 0.9rem; font-weight: 600; }
  .job-time { font-size: 0.75rem; color: var(--muted); }
  .badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 10px;
    color: white;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .badge.pending { background: var(--pending); }
  .badge.processing { background: var(--processing); }
  .badge.completed { background: var(--completed); }
  .badge.failed { background: var(--failed); }

  .detail-empty { color: var(--muted); font-size: 0.9rem; }
  .detail img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); margin-top: 8px; }
  .detail h3 { margin: 0 0 4px; font-size: 1rem; }
  .detail .field { margin-top: 12px; }
  .detail .field-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
  .detail .error-text { color: var(--failed); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>GlitrAI Mini Content Engine</h1>
  <p>Submit a product, generate a creative, check on the job.</p>
</header>

<main>
  <section class="panel" id="form-panel">
    <h2>New generation</h2>
    <form id="generate-form">
      <label for="product_name">Product name</label>
      <input type="text" id="product_name" name="product_name" required>

      <label for="product_description">Short description</label>
      <textarea id="product_description" name="product_description" required></textarea>

      <label for="image">Reference image</label>
      <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp" required>

      <button type="submit" id="submit-btn">Generate</button>
      <div id="form-error"></div>
    </form>
  </section>

  <section class="panel" id="jobs-panel">
    <h2>Jobs</h2>
    <div class="job-list" id="job-list"></div>
  </section>

  <section class="panel detail" id="detail-panel">
    <h2>Result</h2>
    <div id="detail-content" class="detail-empty">Select a job to see its status and result.</div>
  </section>
</main>

<script>
const API_BASE = "";
let selectedJobId = null;
let pollTimer = null;

const form = document.getElementById("generate-form");
const submitBtn = document.getElementById("submit-btn");
const formError = document.getElementById("form-error");
const jobList = document.getElementById("job-list");
const detailContent = document.getElementById("detail-content");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.textContent = "";
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    const formData = new FormData(form);
    const res = await fetch(`${API_BASE}/generate`, { method: "POST", body: formData });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${res.status})`);
    }

    const job = await res.json();
    form.reset();
    await refreshJobs();
    selectJob(job.id);
  } catch (err) {
    formError.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Generate";
  }
});

async function refreshJobs() {
  const res = await fetch(`${API_BASE}/jobs`);
  if (!res.ok) return;
  const jobs = await res.json();
  renderJobList(jobs);
}

function renderJobList(jobs) {
  jobList.innerHTML = "";
  if (jobs.length === 0) {
    jobList.innerHTML = '<div class="detail-empty">No jobs yet.</div>';
    return;
  }
  for (const job of jobs) {
    const card = document.createElement("div");
    card.className = "job-card" + (job.id === selectedJobId ? " selected" : "");
    card.onclick = () => selectJob(job.id);
    card.innerHTML = `
      <div>
        <div class="job-name">${escapeHtml(job.product_name)}</div>
        <div class="job-time">${new Date(job.created_at).toLocaleString()}</div>
      </div>
      <span class="badge ${job.status}">${job.status}</span>
    `;
    jobList.appendChild(card);
  }
}

async function selectJob(jobId) {
  selectedJobId = jobId;
  await refreshJobs();
  await loadDetail(jobId);

  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const job = await loadDetail(jobId);
    if (job && (job.status === "completed" || job.status === "failed")) {
      clearInterval(pollTimer);
      refreshJobs();
    }
  }, 2000);
}

async function loadDetail(jobId) {
  const res = await fetch(`${API_BASE}/jobs/${jobId}`);
  if (!res.ok) {
    detailContent.innerHTML = '<div class="detail-empty">Could not load this job.</div>';
    return null;
  }
  const job = await res.json();
  renderDetail(job);
  return job;
}

function renderDetail(job) {
  let resultBlock = "";
  if (job.status === "completed" && job.result_image_url) {
    resultBlock = `
      <div class="field">
        <div class="field-label">Result</div>
        <img src="${job.result_image_url}" alt="Generated result">
      </div>`;
  } else if (job.status === "failed") {
    resultBlock = `
      <div class="field">
        <div class="field-label">Error</div>
        <div class="error-text">${escapeHtml(job.error_message || "Unknown error")}</div>
      </div>`;
  } else {
    resultBlock = `<div class="field detail-empty">Still ${job.status}...</div>`;
  }

  detailContent.innerHTML = `
    <h3>${escapeHtml(job.product_name)}</h3>
    <span class="badge ${job.status}">${job.status}</span>
    <div class="field">
      <div class="field-label">Description</div>
      <div>${escapeHtml(job.product_description)}</div>
    </div>
    <div class="field">
      <div class="field-label">Reference image</div>
      <img src="${job.reference_image_url}" alt="Reference">
    </div>
    ${job.generated_prompt ? `
      <div class="field">
        <div class="field-label">Generated prompt</div>
        <div>${escapeHtml(job.generated_prompt)}</div>
      </div>` : ""}
    ${resultBlock}
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

refreshJobs();
setInterval(refreshJobs, 5000);
</script>

</body>
</html>
